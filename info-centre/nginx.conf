# Information Center. TLS and the :80 redirect are handled by Traefik, so this
# listens on plain HTTP inside the Docker network only.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # No user input, no cookies, no third-party assets.
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # This block listens on plain HTTP inside the Docker network, but Traefik
    # serves the client over TLS and passes these through, so the browser does
    # receive them over HTTPS and honors them. Without HSTS the very first
    # request of a session can still be downgraded before the redirect is
    # followed.
    #
    # preload is deliberately NOT claimed: it is a one-way commitment for the
    # whole domain and every future subdomain, so it belongs in one estate-wide
    # decision rather than being baked in per site.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # A static documentation site has no use for any of these devices.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Documentation, not a source of record, and it includes third-party
    # manufacturer datasheets. Keep it out of search indexes.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # PDFs open in the browser's viewer rather than downloading blind. The page
    # also offers an explicit download link per document via the `download`
    # attribute, so both behaviors are available.
    location /docs/ {
        types { application/pdf pdf; }
        default_type application/pdf;
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        # Directory listing off: the index page is the only way in, so a file
        # cannot be discovered by browsing.
        autoindex off;
        try_files $uri =404;
    }

    location ~* \.css$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
