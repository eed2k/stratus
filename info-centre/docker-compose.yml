# Information Center at info.stratusweather.co.za
#
# Its own compose project, separate from /opt/stratus, /opt/lightning-panel and
# /opt/lightning-demo, joining the existing Traefik network as external. Nothing
# in the other projects is touched.
#
# Static documents only: no database, no secrets, no route to the panel.
# Read-only root filesystem enforces that.

services:
  info:
    image: nginx:1.27-alpine
    # Keeps its original spelling: this names the running container on the live
    # host. Only the visible page title reads "Information Center".
    container_name: info-centre
    restart: unless-stopped
    networks:
      - stratus_stratus-network
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    # A 951 MB host runs the panel and the Stratus app too. Cap this so serving
    # a few megabytes of PDF can never crowd them out.
    mem_limit: 64m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stratus_stratus-network"
      - "traefik.http.routers.infocentre.rule=Host(`info.stratusweather.co.za`)"
      - "traefik.http.routers.infocentre.entrypoints=websecure"
      - "traefik.http.routers.infocentre.tls.certresolver=letsencrypt"
      - "traefik.http.services.infocentre.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  stratus_stratus-network:
    external: true
