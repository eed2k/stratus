services:
  stratus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stratus-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - STRATUS_DATA_DIR=/app/data
      - DATABASE_URL=${DATABASE_URL}
      - CLIENT_JWT_SECRET=${CLIENT_JWT_SECRET}
      - STRATUS_ADMIN_EMAIL=${STRATUS_ADMIN_EMAIL}
      - STRATUS_ADMIN_PASSWORD=${STRATUS_ADMIN_PASSWORD}
      - STRATUS_ADMIN_NAME=${STRATUS_ADMIN_NAME:-Admin}
      - DROPBOX_APP_KEY=${DROPBOX_APP_KEY}
      - DROPBOX_APP_SECRET=${DROPBOX_APP_SECRET}
      - DROPBOX_REFRESH_TOKEN=${DROPBOX_REFRESH_TOKEN}
      - DROPBOX_FOLDER_PATH=${DROPBOX_FOLDER_PATH}
      - DROPBOX_STATION_ID=${DROPBOX_STATION_ID}
      - MAILERSEND_API_KEY=${MAILERSEND_API_KEY}
      - MAILERSEND_FROM_EMAIL=${MAILERSEND_FROM_EMAIL}
      - MAILERSEND_FROM_NAME=${MAILERSEND_FROM_NAME:-Stratus Weather}
      - MAILERSEND_ALERTS_EMAIL=${MAILERSEND_ALERTS_EMAIL}
      - APP_BASE_URL=${PUBLIC_URL:-https://stratusweather.co.za}
      # Staleness monitor (offline-station email alerts - disabled by default)
      - STALENESS_ALERTS_ENABLED=${STALENESS_ALERTS_ENABLED:-false}
      - STALENESS_CHECK_INTERVAL=${STALENESS_CHECK_INTERVAL:-900000}
      - STALENESS_THRESHOLD=${STALENESS_THRESHOLD:-7200000}
      - STALENESS_COOLDOWN=${STALENESS_COOLDOWN:-21600000}
      # Daily Stratus Report (digest email)
      - DIGEST_ENABLED=${DIGEST_ENABLED:-false}
      - DIGEST_RECIPIENT=${DIGEST_RECIPIENT:-esterhuizen2k@proton.me}
      - DIGEST_CRON=${DIGEST_CRON:-0 8 * * *}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - stratus-data:/app/data
      - stratus-logs:/app/logs
      # The weekday operations digest reports on backup health, and it reads the
      # backup directory off disk. Without this mount `fs.existsSync` runs inside
      # the container, finds nothing, and the email says "Last backup: none found"
      # while cron has in fact been writing every six hours the whole time. The
      # host directory currently holds 429 files totalling 3 GB.
      #
      # READ-ONLY on purpose: the app only ever needs to stat these files, and it
      # must never be able to modify or delete a backup.
      - /opt/stratus/backups:/opt/stratus/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stratus-network
    # Health check tuned for a small host that also has to build on itself.
    #
    # This is a 951 MB box. A docker build's npm ci pushes it into swap, and while
    # it is thrashing the app stays alive but answers slowly. At timeout 10s and
    # retries 3 that was enough for 15 consecutive failures, so Traefik pulled a
    # working backend out of rotation and the site went dark for the length of the
    # build. Nothing was actually broken.
    #
    # 30s timeout with 5 retries tolerates a slow answer without tolerating a dead
    # one: a genuinely hung app is still marked unhealthy inside three minutes.
    #
    # start_period covers boot, not load. createTables() runs dozens of
    # CREATE TABLE IF NOT EXISTS statements plus about forty ALTER TABLE
    # migrations against a REMOTE Postgres on every start, which measured around
    # three minutes. 300s leaves headroom above that.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 300s
    labels:
      - "traefik.enable=true"
      # Main domain
      - "traefik.http.routers.stratus.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.stratus.entrypoints=websecure"
      - "traefik.http.routers.stratus.tls.certresolver=letsencrypt"
      - "traefik.http.services.stratus.loadbalancer.server.port=5000"
      # www redirect → apex
      - "traefik.http.routers.stratus-www.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.stratus-www.entrypoints=websecure"
      - "traefik.http.routers.stratus-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stratus-www.middlewares=www-redirect"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"

  postgres:
    image: postgres:15-alpine
    container_name: stratus-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=stratus
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=stratus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stratus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratus -d stratus"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v2.11
    container_name: stratus-traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=stratus_stratus-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt-data:/letsencrypt
    networks:
      - stratus-network

volumes:
  stratus-data:
  stratus-logs:
  postgres-data:
  letsencrypt-data:

networks:
  stratus-network:
    driver: bridge
