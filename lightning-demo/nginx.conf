# Static demo site. TLS and the redirect from :80 are handled by Traefik, so
# this listens on plain HTTP inside the Docker network only.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik is the only client, and it sets X-Forwarded-For.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # The page carries no user input, no cookies and no third-party assets, so
    # the policy can be strict: same-origin only, no framing, no plugins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # It is a demonstration, not a source of record. Keep it out of search
    # results so it cannot be mistaken for the live console.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # style.css and demo.js change only on deploy; the HTML is small.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
